name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The site imports the same pure modules the suite covers; run it first so
      # a browser-safety regression can never ship to the page.
      - run: npm test
      # Generate the topic pages: fixes.json modules + the compat-observed long
      # tail (--live fetches the matrix; the script falls back gracefully).
      - run: node web/gen/e.mjs --live
      # Assemble a clean, minimal artifact — authored files + generated pages, no .git or tests.
      - run: |
          mkdir -p _site
          cp -r index.html web lib e m llms.txt robots.txt sitemap.xml KEY.txt _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
